name: Validate Development
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew :protocol:test :signature:testDebugUnitTest :signature:lintDebug :signature:assembleDebug :signature:assembleDebugAndroidTest :examples:integration:assembleDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports-and-device-test-apk
          path: |
            protocol/build/reports/
            signature/build/reports/
            signature/build/outputs/apk/androidTest/
  docs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: root
            base: /
          - target: project-pages
            base: /android.apexfission.signature/
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned shared documentation CLI
        run: ./docs.sh --version
      - name: Check shared documentation contracts
        run: |
          ./docs.sh bootstrap check
          ./docs.sh check
          ./docs.sh history verify
      - name: Test review acceptance and translated code contracts
        run: node --test tools/docs.test.mjs
      - name: Build and verify shared Astro documentation
        env:
          DOCS_BASE: ${{ matrix.base }}
        run: node tools/docs.mjs verify --base "$DOCS_BASE"
      - uses: actions/upload-artifact@v7
        with:
          name: development-human-and-agent-docs-${{ matrix.target }}
          path: sites/dist/
